version: '3.9'

services:
  model:
    build: .
    container_name: ultralytics
    command: python cheks.py 
    volumes:
      - .:/app
    # ↓ КРИТИЧЕСКИ ВАЖНО: доступ к GPU ↓
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # ИЛИ альтернативный вариант (новые версии Docker):
    # runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility